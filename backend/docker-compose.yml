services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: java_rest_api_template
    env_file: .env
    ports:
      - "${SERVER_PORT:-8080}:8080"
    restart: unless-stopped
    volumes:
      - ./logs:/app/logs  # Persist logs
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

