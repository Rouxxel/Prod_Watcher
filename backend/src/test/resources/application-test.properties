spring.datasource.url=jdbc:h2:mem:prodwatch_test_${random.uuid};MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=none
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.flyway.enabled=false

spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema-h2.sql

prodwatch.pos.tax-rate=0.16

CORS_ALLOWED_ORIGINS=http://localhost:8000,http://localhost:8080,http://localhost:3000

SUPABASE_URL=https://test.supabase.co
SUPABASE_JWT_SECRET=test-jwt-secret-for-unit-tests-only-min-32-chars
SUPABASE_SERVICE_ROLE_KEY=test-service-role-key
SUPABASE_ANON_KEY=test-anon-key
