#############################################################################
### Production profile properties — ProdWatch API
### Activate with: SPRING_PROFILES_ACTIVE=prod
#############################################################################

# Disable Swagger UI in production (set SWAGGER_ENABLED=false on Render)
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}

# Restrict error messages in production
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false

# Restrict actuator endpoints to health only
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=when-authorized
