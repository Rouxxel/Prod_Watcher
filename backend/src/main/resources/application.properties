#############################################################################
### Spring Boot bootstrap properties
###
### Kept intentionally tiny: the central source of truth is
### src/main/resources/core_specs/configuration/config_file.json.
###
### CoreSpecsInitializer reads that JSON before the context starts and feeds
### values (server port/host, every endpoint's prefix/route, etc.) into the
### Spring Environment under the "config.*" and "data.*" prefixes, so they can
### be referenced both programmatically (ConfigLoader/DataLoader) and via
### ${config....} placeholders in controller annotations.
#############################################################################

# Register the initializer that bridges config_file.json + general_data.json
# into the Spring Environment. This is the ONLY wiring needed here.
context.initializer.classes=com.template.restapi.config.CoreSpecsInitializer

# Application metadata (overridable via .env / real environment variables).
spring.application.name=${API_TITLE:Java REST API Template}

# OpenAPI / Swagger UI locations (FastAPI's /docs and /redoc equivalents).
springdoc.swagger-ui.path=/docs
springdoc.api-docs.path=/api-docs

# Render a clean JSON error body instead of Spring's default whitelabel page.
server.error.include-message=always
server.error.include-binding-errors=always

# server.port and server.address are set at runtime by CoreSpecsInitializer
# from config_file.json -> network.server_port / network.host.
