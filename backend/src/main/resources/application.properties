#############################################################################
### Spring Boot bootstrap properties — ProdWatch API
#############################################################################

context.initializer.classes=com.prodwatch.api.config.CoreSpecsInitializer

spring.application.name=${API_TITLE:ProdWatch API}

springdoc.swagger-ui.path=/docs
springdoc.api-docs.path=/api-docs

server.error.include-message=always
server.error.include-binding-errors=always

# PostgreSQL (Supabase) — set DATABASE_URL in .env or Render
spring.datasource.url=${DATABASE_URL}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
# When schema was created via Supabase SQL Editor (non-empty DB, no flyway history), baseline at V12.
# Active migrations are the historical V1–V26 set (matches existing databases).
# The squashed V1–V14 chain lives in db/squashed_v1-v14/ (NOT scanned) for future fresh installs only.
spring.flyway.baseline-version=12

# Bootstrap-only: seeds workspace_settings.tax_rate when no row exists (default 0.16).
# Runtime checkout tax reads workspace_settings after bootstrap — configure via Settings UI.
prodwatch.pos.tax-rate=${POS_TAX_RATE:0.16}
# Optional — deduct stock from this warehouse for all checkout lines; otherwise each product's default warehouse
prodwatch.pos.warehouse-id=${POS_WAREHOUSE_ID:}
