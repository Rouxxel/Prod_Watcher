#############################################################################
### Spring Boot bootstrap properties — ProdWatch API
#############################################################################

context.initializer.classes=com.prodwatch.api.config.CoreSpecsInitializer

spring.application.name=${API_TITLE:ProdWatch API}

springdoc.swagger-ui.path=/docs
springdoc.api-docs.path=/api-docs

server.error.include-message=always
server.error.include-binding-errors=always

# PostgreSQL (Supabase) — set DATABASE_URL in .env or Render
spring.datasource.url=${DATABASE_URL}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
# When schema was created via Supabase SQL Editor (non-empty DB, no flyway history), baseline at V12.
spring.flyway.baseline-version=12
